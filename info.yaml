# Tiny Tapeout project information
project:
  title:        "Polyglot: protocol emulator programmed in plain C"      # Project title
  author:       "Tyler Hong"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "RISC-V (RV32EC) core running stock-GCC C plus timed wire engines for UART, SPI, I2C and more"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tyler913_polyglot"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "pg_top.v"
    - "pg_ahb.v"
    - "pg_host_spi.v"
    - "pg_sram.v"
    - "pg_io.v"
    - "pg_sysio.v"
    - "pg_wire.v"
    - "pg_fifo.v"
    - "pg_dma.v"
    - "hazard3_alu.v"
    - "hazard3_branchcmp.v"
    - "hazard3_core.v"
    - "hazard3_cpu_1port.v"
    - "hazard3_csr.v"
    - "hazard3_decode.v"
    - "hazard3_frontend.v"
    - "hazard3_instr_decompress.v"
    - "hazard3_irq_ctrl.v"
    - "hazard3_mul_fast.v"
    - "hazard3_muldiv_seq.v"
    - "hazard3_onehot_encode.v"
    - "hazard3_onehot_priority.v"
    - "hazard3_onehot_priority_dynamic.v"
    - "hazard3_pmp.v"
    - "hazard3_power_ctrl.v"
    - "hazard3_priority_encode.v"
    - "hazard3_regfile_1w2r.v"
    - "hazard3_shift_barrel.v"
    - "hazard3_triggers.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "P16"
  ui[1]: "P17"
  ui[2]: "P18"
  ui[3]: "P19"
  ui[4]: "P20"
  ui[5]: "HOST_SCK"
  ui[6]: "HOST_MOSI"
  ui[7]: "HOST_CS_N"

  # Outputs
  uo[0]: "P8"
  uo[1]: "P9"
  uo[2]: "P10"
  uo[3]: "P11"
  uo[4]: "P12"
  uo[5]: "P13"
  uo[6]: "HOST_IRQ"
  uo[7]: "HOST_MISO"

  # Bidirectional pins
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"

# Do not change!
yaml_version: 6
